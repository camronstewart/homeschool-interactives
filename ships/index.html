<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b2236">
<title>Ships Ahoy!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9B%B5%3C/text%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/Fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <symbol id="i-speak" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h5v-6h3v6h5V10" fill="currentColor"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2.5c3.5 5 7 8.4 7 12.3a7 7 0 01-14 0c0-3.9 3.5-7.3 7-12.3z" fill="currentColor"/><path d="M9 15a3 3 0 003 3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7"/></symbol>
  <symbol id="i-hammer" viewBox="0 0 24 24"><path d="M13.5 6.5l4 4L8 20a2.1 2.1 0 01-3-3z" fill="currentColor"/><path d="M11 4l3-1.5 6.5 6.5L19 12l-1.5-1.5-4-4z" fill="currentColor"/></symbol>
  <symbol id="i-sail" viewBox="0 0 24 24"><path d="M12 2v15" stroke="currentColor" stroke-width="2"/><path d="M13 3c4 3 6.5 8 6.5 13H13z" fill="currentColor"/><path d="M11 6c-2.5 3-4 6.5-4.5 10H11z" fill="currentColor" opacity=".75"/><path d="M3 18.5h18l-2.5 3.5h-13z" fill="currentColor"/></symbol>
  <symbol id="i-anchor" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6.7V21M8 10h8M4 13c0 5 4 8 8 8s8-3 8-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M2.5 14l1.5-2.5 2 2.5M21.5 14L20 11.5 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-float" viewBox="0 0 48 48"><path d="M2 26c5 0 5-3 10-3s5 3 10 3 5-3 10-3 5 3 10 3 4-2 4-2v22H2z" fill="#2f7fc1"/><rect x="15" y="9" width="18" height="16" rx="4" fill="#f2c94c" stroke="#8a6d1a" stroke-width="1.5"/><path d="M24 2v5M20 4l4-3 4 3" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sink" viewBox="0 0 48 48"><path d="M2 12c5 0 5-3 10-3s5 3 10 3 5-3 10-3 5 3 10 3 4-2 4-2v36H2z" fill="#2f7fc1"/><rect x="16" y="32" width="16" height="12" rx="3" fill="#8b8f96" stroke="#3d4148" stroke-width="1.5"/><path d="M24 15v11M19 22l5 5 5-5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 14c2-6 4-6 6 0s4 6 6 0 4-6 6 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z" fill="currentColor"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8H8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M9 1L5.5 4 9 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-q" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M16 16l5 5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-horn" viewBox="0 0 24 24"><path d="M3 9h3l10-5v16L6 15H3z" fill="currentColor"/><path d="M6 15l1.5 5h3L9 15.6" fill="currentColor"/><path d="M19 8l2-1.5M19.5 12H22M19 16l2 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-penny" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#b8673a" stroke="#7a3f1f" stroke-width="1.5"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#e7a678" stroke-width="1" opacity=".8"/></symbol>
  <symbol id="i-clay-ball" viewBox="0 0 48 48"><circle cx="24" cy="26" r="15" fill="#4aa07a"/><circle cx="19" cy="21" r="5" fill="#fff" opacity=".25"/></symbol>
  <symbol id="i-clay-flat" viewBox="0 0 48 48"><ellipse cx="24" cy="30" rx="20" ry="6" fill="#4aa07a"/><ellipse cx="20" cy="28" rx="8" ry="2" fill="#fff" opacity=".25"/></symbol>
  <symbol id="i-clay-bowl" viewBox="0 0 48 48"><path d="M6 20h36c0 12-8 18-18 18S6 32 6 20z" fill="#4aa07a"/><path d="M10 20h28c0 8-6 12-14 12s-14-4-14-12z" fill="#2f7656"/></symbol>
  <symbol id="i-clay-boat" viewBox="0 0 48 48"><path d="M2 18h44l-7 18H9z" fill="#4aa07a"/><path d="M7 18h34l-5 13H12z" fill="#2f7656"/></symbol>
  <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 10-3-3M3 12h16a3 3 0 11-3 3M3 16h8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M9 11V4.5a1.5 1.5 0 013 0V10V3.5a1.5 1.5 0 013 0V10V5a1.5 1.5 0 013 0v8c0 4.5-2.5 8-7 8-3 0-4.5-1.5-6-4l-2.7-4.6a1.5 1.5 0 012.6-1.5L9 13z" fill="currentColor"/></symbol>
 </defs>
</svg>
<div id="app">
  <header class="topbar" id="topbar">
    <button class="tb-btn home" id="homeBtn" aria-label="Home"><svg><use href="#i-home"/></svg></button>
    <div class="tb-title"><svg class="tb-ico" id="tbIco"><use href="#i-anchor"/></svg><span id="tbTitle">Ships Ahoy!</span></div>
    <div class="tb-extra" id="tbExtra"></div>
    <button class="tb-btn speak" id="helpBtn" aria-label="Read aloud"><svg><use href="#i-speak"/></svg></button>
  </header>

  <!-- HOME -->
  <main class="view on" id="v-home">
    <div class="hero" style="background-image:url(assets/hero.jpg)"></div>
    <div class="home-inner">
      <div class="home-head">
        <div class="kicker">Ian's harbor</div>
        <h1>Ships Ahoy!</h1>
        <button class="big-speak" id="homeSpeak" aria-label="Read aloud"><svg><use href="#i-speak"/></svg></button>
      </div>
      <div class="tiles">
        <button class="tile" data-go="world" data-say="Ships of the world"><span class="tile-img" style="background-image:url(assets/th-hokulea.jpg)"></span><span class="tile-badge"><svg><use href="#i-globe"/></svg></span><b>Ships of the World</b></button>
        <button class="tile" data-go="float" data-say="Float or sink"><span class="tile-img water-tile"><img src="assets/obj-duck.webp" alt=""><img class="sunk" src="assets/obj-key.webp" alt=""></span><span class="tile-badge"><svg><use href="#i-drop"/></svg></span><b>Float or Sink</b></button>
        <button class="tile" data-go="build" data-say="Build a ship"><span class="tile-img" style="background-image:url(assets/real-ribs.jpg)"></span><span class="tile-badge"><svg><use href="#i-hammer"/></svg></span><b>Build a Ship</b></button>
        <button class="tile" data-go="sail" data-say="Sail it"><span class="tile-img" style="background-image:url(assets/go-sail.jpg)"></span><span class="tile-badge"><svg><use href="#i-sail"/></svg></span><b>Sail It</b></button>
        <button class="tile" data-go="parts" data-say="Parts of a ship"><span class="tile-img" style="background-image:url(assets/constitution.jpg);background-position:30% 60%"></span><span class="tile-badge"><svg><use href="#i-anchor"/></svg></span><b>Parts of a Ship</b></button>
      </div>
      <button class="credits-link" id="creditsBtn">Photo credits</button>
    </div>
  </main>

  <!-- WORLD -->
  <main class="view" id="v-world">
    <div class="map-wrap" id="mapWrap"><div class="map" id="map"><img src="assets/world.jpg" alt="World map" draggable="false"><svg class="map-lines" id="mapLines" viewBox="0 0 1000 500" preserveAspectRatio="none"></svg></div></div>
    <div class="timeline" id="timeline"><div class="tl-track" id="tlTrack"></div></div>
  </main>

  <!-- FLOAT -->
  <main class="view" id="v-float">
    <section class="tank-wrap"><canvas id="tank"></canvas>
      <div class="guess" id="guess"><button class="guess-btn" data-g="float" aria-label="Float"><svg><use href="#i-float"/></svg></button><button class="guess-btn" data-g="sink" aria-label="Sink"><svg><use href="#i-sink"/></svg></button></div>
      <div class="bubble-msg" id="floatMsg"></div>
    </section>
    <aside class="float-side">
      <div class="mode-sw" id="floatMode"><button class="on" data-m="objects"><img src="assets/obj-apple.webp" alt="Things"></button><button data-m="clay"><svg><use href="#i-clay-boat"/></svg></button></div>
      <div id="fsObjects" class="fs-pane on">
        <div class="tray" id="tray"></div>
        <div class="results"><div class="res" id="resFloat"><svg><use href="#i-float"/></svg><div class="res-items"></div></div><div class="res" id="resSink"><svg><use href="#i-sink"/></svg><div class="res-items"></div></div></div>
        <button class="round-btn" id="emptyTank" aria-label="Empty the tank"><svg><use href="#i-reset"/></svg></button>
      </div>
      <div id="fsClay" class="fs-pane">
        <div class="shapes" id="shapes"><button data-s="0" class="on"><svg><use href="#i-clay-ball"/></svg></button><button data-s="1"><svg><use href="#i-clay-flat"/></svg></button><button data-s="2"><svg><use href="#i-clay-bowl"/></svg></button><button data-s="3"><svg><use href="#i-clay-boat"/></svg></button></div>
        <div class="cargo-row"><button class="cargo-btn" id="addPenny" aria-label="Add a penny"><img src="assets/obj-penny.webp" alt=""><span>+1</span></button><div class="cargo-count" id="pennyCount"><img src="assets/obj-penny.webp" alt=""><b id="pennyN">0</b></div></div>
        <div class="best" id="bestRow"><svg><use href="#i-star"/></svg><b id="bestN">0</b></div>
        <button class="round-btn" id="clayReset" aria-label="Start over"><svg><use href="#i-reset"/></svg></button>
      </div>
    </aside>
  </main>

  <!-- BUILD -->
  <main class="view" id="v-build">
    <section class="yard" id="yard"></section>
    <aside class="parts-tray" id="partsTray"></aside>
    <div class="photo-pop" id="photoPop"><img alt=""><button class="mini-speak" aria-label="Read aloud"><svg><use href="#i-speak"/></svg></button></div>
  </main>

  <!-- SAIL -->
  <main class="view" id="v-sail">
    <div class="sail-modes mode-sw" id="sailMode"><button class="on" data-m="game"><svg><use href="#i-sail"/></svg></button><button data-m="power"><svg><use href="#i-sound"/></svg></button></div>
    <section class="sea-wrap" id="seaWrap"><canvas id="sea"></canvas>
      <div class="compass" id="compass"><div class="compass-ring"><span>N</span></div><div class="wind-arrow" id="windArrow"><svg viewBox="0 0 40 120"><path d="M20 4v92" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M6 84l14 30 14-30z" fill="#fff"/><circle cx="20" cy="8" r="7" fill="#9fd4ff"/></svg></div><svg class="compass-wind"><use href="#i-wind"/></svg></div>
      <div class="helm">
        <button class="steer" id="steerL" aria-label="Turn left"><svg><use href="#i-left"/></svg></button>
        <div class="wheel" id="wheel"><svg viewBox="0 0 120 120"><g id="wheelG"><circle cx="60" cy="60" r="38" fill="none" stroke="#7a4a22" stroke-width="10"/><circle cx="60" cy="60" r="38" fill="none" stroke="#b07a44" stroke-width="4"/><g stroke="#8c5a2b" stroke-width="7" stroke-linecap="round"><path d="M60 6v108M6 60h108M22 22l76 76M98 22L22 98"/></g><circle cx="60" cy="60" r="12" fill="#c8a050" stroke="#7a4a22" stroke-width="4"/></g></svg></div>
        <button class="steer" id="steerR" aria-label="Turn right"><svg><use href="#i-right"/></svg></button>
      </div>
      <div class="rope" id="rope"><div class="rope-label in"><svg viewBox="0 0 40 40"><path d="M6 34L20 6l14 28" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg></div><div class="rope-track" id="ropeTrack"><div class="rope-knob" id="ropeKnob"></div></div><div class="rope-label out"><svg viewBox="0 0 40 40"><path d="M4 34C10 10 30 10 36 34" fill="#fff"/></svg></div></div>
      <div class="sail-hint" id="sailHint"></div>
      <div class="buoy-count" id="buoyCount"></div>
    </section>
    <section class="power" id="power"></section>
  </main>

  <!-- PARTS -->
  <main class="view" id="v-parts">
    <section class="ship-photo" id="shipPhoto"><div class="sp-inner" id="spInner"><img src="assets/constitution.jpg" alt="USS Constitution" draggable="false"></div></section>
    <aside class="parts-side">
      <div class="mode-sw" id="partsMode"><button class="on" data-m="learn"><svg><use href="#i-hand"/></svg></button><button data-m="quiz"><svg><use href="#i-q"/></svg></button></div>
      <div class="quiz-box" id="quizBox"><button class="big-speak" id="quizSay" aria-label="Hear again"><svg><use href="#i-speak"/></svg></button><div class="stars" id="quizStars"></div></div>
      <div class="ps-card" id="portStar">
        <svg viewBox="0 0 220 260" class="topship"><defs><linearGradient id="deckG" x1="0" x2="1"><stop offset="0" stop-color="#a8743f"/><stop offset=".5" stop-color="#d1a26a"/><stop offset="1" stop-color="#a8743f"/></linearGradient></defs>
          <path d="M110 14C150 60 160 120 158 200c-1 22-14 40-48 40s-47-18-48-40C60 120 70 60 110 14z" fill="#3b2a1d"/><path d="M110 26c32 42 40 98 39 172-1 18-11 32-39 32s-38-14-39-32c-1-74 7-130 39-172z" fill="url(#deckG)"/>
          <g stroke="#8a5d30" stroke-width="1.2" opacity=".6"><path d="M90 70v150M100 50v176M110 30v200M120 50v176M130 70v150"/></g><circle cx="110" cy="100" r="6" fill="#5a3a1c"/><circle cx="110" cy="160" r="6" fill="#5a3a1c"/>
          <path d="M110 4l-10 14h20z" fill="#fff" opacity=".8"/>
          <g class="side port" data-side="port"><rect x="0" y="40" width="80" height="200" fill="transparent"/><circle cx="58" cy="120" r="14" fill="#e63b3b" class="lamp"/></g>
          <g class="side starboard" data-side="starboard"><rect x="140" y="40" width="80" height="200" fill="transparent"/><circle cx="162" cy="120" r="14" fill="#2ecc71" class="lamp"/></g>
        </svg>
      </div>
      <div class="fx-btns"><button class="fx-btn" id="anchorBtn" aria-label="Drop the anchor"><svg><use href="#i-anchor"/></svg></button><button class="fx-btn" id="hornBtn" aria-label="Ship horn"><svg><use href="#i-horn"/></svg></button></div>
    </aside>
    <div class="anchor-drop" id="anchorDrop"><div class="chain"></div><svg viewBox="0 0 24 24"><use href="#i-anchor"/></svg></div>
  </main>

  <section class="modal" id="modal" aria-hidden="true"><div class="modal-card" id="modalCard"></div></section>
  <div class="toast" id="toast"></div>
  <div class="confetti" id="confetti"></div>
</div>
<script src="credits.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="world.js"></script>
<script src="float.js"></script>
<script src="build.js"></script>
<script src="sail.js"></script>
<script src="parts.js"></script>
</body>
</html>
