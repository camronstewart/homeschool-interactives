<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a1d12">
<title>Liberty Village, 1774 · Colonial Trades</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%98%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><div class="kicker">A Colonial Town · 1774</div><h1>Liberty Village</h1></div>
    <div class="topbtns">
      <button class="pill ghost" id="needsBtn"><span class="needcount">0/7</span><span class="nl">Family list</span><span class="ns">📜</span></button>
      <button class="pill ghost" id="helpBtn" aria-label="How to play">?</button>
    </div>
  </header>
  <main class="main">
    <section class="board">
      <div class="mapwrap" id="mapwrap"><svg id="map" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" aria-label="Map of Liberty Village"></svg></div>
      <div class="tray" id="tray" aria-label="Tradespeople"></div>
    </section>
    <aside class="needs" id="needs">
      <h2>The Hale family needs…</h2>
      <p class="sub">No stores! Help them find each trade in town.</p>
      <ul id="needList"></ul>
    </aside>
  </main>
  <footer class="foot"><button id="creditsBtn">Photo credits</button></footer>
</div>
<div id="drag" aria-hidden="true"></div>
<div class="modal" id="modal" aria-hidden="true"><div class="card" id="card" role="dialog"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="credits.js"></script>
<script src="app.js"></script>
</body>
</html>
